<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Check your Fire and Rescue Academy application status."><meta name="theme-color" content="#142725"><meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/images/academy-favicon-clean.png" type="image/png"><link rel="stylesheet" href="assets/css/readystation.css"><title>Application status | Fire and Rescue Academy</title>
</head>
<body data-auth-page="status">
  <main class="status-page" id="main">
    <a class="brand" href="index.html" aria-label="Fire and Rescue Academy home"><span class="brand-lockup"><span class="brand-emblem"><img src="assets/images/academy-emblem-clean-256.png" alt="" width="256" height="256" aria-hidden="true"></span><span class="brand-wordmark"><strong>Fire &amp; Rescue</strong><small>Academy</small></span></span></a>
    <section class="auth-status-card" aria-live="polite">
      <div class="status-icon" data-status-icon>…</div><p class="eyebrow">Account application</p><h1 data-status-title>Checking your status</h1><p data-status-copy>We are loading your academy application.</p>
      <dl class="status-details" data-status-details hidden><div><dt>Applicant</dt><dd data-applicant-name>—</dd></div><div><dt>Requested role</dt><dd data-requested-role>—</dd></div><div><dt>Status</dt><dd><span class="status-pill" data-status-pill>Pending</span></dd></div></dl>
      <div class="status-actions"><a class="btn btn-primary" href="login.html" data-login-link hidden>Log in</a><button class="btn btn-ghost" type="button" data-sign-out hidden>Sign out</button><a class="btn btn-ghost" href="index.html">Return home</a></div>
    </section>
  </main>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
